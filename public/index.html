<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Front-End - API de Produtos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Front-End - Teste da API de Produtos</h1>
<p>API rodando em: <code id="apiUrl">http://localhost:3000</code></p>

<section>
  <h2>1. Listar Todos</h2>
  <button onclick="listarTodos()">Listar Todos</button>
</section>

<section>
  <h2>2. Filtrar por Categoria (req.query)</h2>
  <input type="text" id="inputCategoria" placeholder="ex: Eletrônicos">
  <button onclick="filtrarCategoria()">Filtrar</button>
</section>

<section>
  <h2>3. Buscar por ID (req.params)</h2>
  <input type="number" id="inputId" placeholder="ex: 1 ou 999">
  <button onclick="buscarPorId()">Buscar</button>
</section>

<section>
  <h2>4. Cadastrar Produto (req.body)</h2>
  <label>Nome</label>
  <input type="text" id="novoNome" placeholder="Nome do produto">
  <label>Categoria</label>
  <input type="text" id="novaCategoria" placeholder="Categoria">
  <label>Preço</label>
  <input type="number" id="novoPreco" placeholder="Preço" step="0.01">
  <br>
  <button onclick="cadastrarProduto()">Cadastrar (POST)</button>
</section>

<section>
  <h2>5. Deletar por ID</h2>
  <input type="number" id="deleteId" placeholder="ex: 3">
  <button onclick="deletarProduto()">Deletar</button>
</section>

<section>
  <h2>Resultado</h2>
  <pre id="resultado">// as respostas da API vão aparecer aqui</pre>
</section>

<script src="script.js"></script>

</body>
</html>
